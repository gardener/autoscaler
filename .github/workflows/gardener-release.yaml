name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch


jobs:
  build:
    if: github.ref_name == 'machine-controller-manager-provider' || startsWith(github.ref_name, 'rel-v')
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      mode: release

  release-to-github-and-bump:
    if: github.ref_name == 'machine-controller-manager-provider' || startsWith(github.ref_name, 'rel-v')
    uses: gardener/cc-utils/.github/workflows/release.yaml@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
    needs:
      - build
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      slack-channel-id: C0170QTBJUW # #gardener-mcm
